<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 V2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', sans-serif;
        }
        .container { text-align: center; padding: 20px; }
        h1 { color: #00d9ff; margin-bottom: 15px; text-shadow: 0 0 10px rgba(0, 217, 255, 0.5); }
        .score-board { display: flex; justify-content: center; gap: 30px; margin-bottom: 15px; }
        .score-item { color: #fff; font-size: 18px; }
        .score-item span { color: #00ff88; font-weight: bold; }
        canvas { border: 3px solid #00d9ff; border-radius: 10px; box-shadow: 0 0 20px rgba(0, 217, 255, 0.3); }
        .controls { margin-top: 15px; color: #888; font-size: 14px; }
        .btn { background: linear-gradient(135deg, #00d9ff, #00ff88); border: none; padding: 10px 25px; border-radius: 25px; color: #1a1a2e; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 贪吃蛇 V2</h1>
        <div class="score-board">
            <div class="score-item">得分: <span id="score">0</span></div>
            <div class="score-item">最高分: <span id="highScore">0</span></div>
        </div>
        <canvas id="game" width="400" height="400"></canvas>
        <div class="controls">方向键 / WASD 控制 | 空格暂停</div>
        <button class="btn" id="startBtn">开始游戏</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const gridSize = 20, gridCount = canvas.width / gridSize;
        let snake = [{x: 10, y: 10}], food = {x: 15, y: 15};
        let direction = {x: 0, y: 0}, score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null, isPaused = false;
        document.getElementById('highScore').textContent = highScore;
        
        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#00ff88' : '#00d9ff';
                ctx.beginPath();
                ctx.roundRect(s.x * gridSize + 1, s.y * gridSize + 1, gridSize - 2, gridSize - 2, 5);
                ctx.fill();
            });
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function update() {
            if (isPaused || (direction.x === 0 && direction.y === 0)) return;
            const head = {x: (snake[0].x + direction.x + gridCount) % gridCount, y: (snake[0].y + direction.y + gridCount) % gridCount};
            if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                spawnFood();
            } else snake.pop();
            draw();
        }
        
        function spawnFood() {
            do { food = {x: Math.floor(Math.random() * gridCount), y: Math.floor(Math.random() * gridCount)}; }
            while (snake.some(s => s.x === food.x && s.y === food.y));
        }
        
        function gameOver() {
            clearInterval(gameLoop);
            if (score > highScore) { highScore = score; localStorage.setItem('snakeHighScore', highScore); document.getElementById('highScore').textContent = highScore; }
            alert('游戏结束！得分: ' + score);
            resetGame();
        }
        
        function resetGame() { snake = [{x: 10, y: 10}]; direction = {x: 0, y: 0}; score = 0; document.getElementById('score').textContent = 0; spawnFood(); draw(); }
        function startGame() { resetGame(); gameLoop = setInterval(update, 120); }
        
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (key === ' ') { isPaused = !isPaused; return; }
            if ((key === 'arrowup' || key === 'w') && direction.y !== 1) direction = {x: 0, y: -1};
            if ((key === 'arrowdown' || key === 's') && direction.y !== -1) direction = {x: 0, y: 1};
            if ((key === 'arrowleft' || key === 'a') && direction.x !== 1) direction = {x: -1, y: 0};
            if ((key === 'arrowright' || key === 'd') && direction.x !== -1) direction = {x: 1, y: 0};
        });
        
        document.getElementById('startBtn').addEventListener('click', startGame);
        draw();
    </script>
</body>
</html>
