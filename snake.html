<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', sans-serif;
        }
        h1 { color: #00ff88; margin-bottom: 20px; text-shadow: 0 0 10px #00ff88; }
        #gameCanvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .info { display: flex; gap: 40px; margin: 20px 0; color: #fff; font-size: 18px; }
        .info span { color: #00ff88; font-weight: bold; }
        #startBtn {
            padding: 12px 40px;
            font-size: 18px;
            background: #00ff88;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #startBtn:hover { transform: scale(1.1); box-shadow: 0 0 20px #00ff88; }
        .controls { margin-top: 20px; color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="info">
        <div>得分: <span id="score">0</span></div>
        <div>最高分: <span id="highScore">0</span></div>
    </div>
    <button id="startBtn">开始游戏</button>
    <div class="controls">使用方向键 ↑ ↓ ← → 或 WASD 控制</div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20, gridCount = canvas.width / gridSize;
        let snake, food, direction, nextDirection, score, highScore, gameLoop, gameRunning;
        highScore = localStorage.getItem('snakeHighScore') || 0;
        document.getElementById('highScore').textContent = highScore;

        function init() {
            snake = [{ x: 10, y: 10 }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            document.getElementById('score').textContent = score;
            spawnFood();
        }

        function spawnFood() {
            do {
                food = { x: Math.floor(Math.random() * gridCount), y: Math.floor(Math.random() * gridCount) };
            } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
        }

        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#2a2a4e';
            for (let i = 0; i <= gridCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            snake.forEach((seg, i) => {
                const g = ctx.createRadialGradient(seg.x * gridSize + gridSize/2, seg.y * gridSize + gridSize/2, 0, seg.x * gridSize + gridSize/2, seg.y * gridSize + gridSize/2, gridSize/2);
                g.addColorStop(0, i === 0 ? '#00ff88' : '#00cc66');
                g.addColorStop(1, i === 0 ? '#00cc66' : '#009944');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.roundRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2, 5);
                ctx.fill();
            });
        }

        function update() {
            direction = nextDirection;
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            if (head.x < 0) head.x = gridCount - 1;
            if (head.x >= gridCount) head.x = 0;
            if (head.y < 0) head.y = gridCount - 1;
            if (head.y >= gridCount) head.y = 0;
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) { gameOver(); return; }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    document.getElementById('highScore').textContent = highScore;
                }
                spawnFood();
            } else { snake.pop(); }
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('startBtn').textContent = '重新开始';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff6b6b';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束!', canvas.width/2, canvas.height/2 - 20);
            ctx.fillStyle = '#fff';
            ctx.font = '24px sans-serif';
            ctx.fillText('得分: ' + score, canvas.width/2, canvas.height/2 + 20);
        }

        function startGame() {
            init();
            gameRunning = true;
            document.getElementById('startBtn').textContent = '游戏中...';
            gameLoop = setInterval(() => { update(); draw(); }, 100);
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            const keyMap = {
                'ArrowUp': { x: 0, y: -1 }, 'KeyW': { x: 0, y: -1 },
                'ArrowDown': { x: 0, y: 1 }, 'KeyS': { x: 0, y: 1 },
                'ArrowLeft': { x: -1, y: 0 }, 'KeyA': { x: -1, y: 0 },
                'ArrowRight': { x: 1, y: 0 }, 'KeyD': { x: 1, y: 0 }
            };
            const newDir = keyMap[e.code];
            if (newDir && (newDir.x !== -direction.x || newDir.y !== -direction.y)) nextDirection = newDir;
        });
        init(); draw();
    </script>
</body>
</html>
